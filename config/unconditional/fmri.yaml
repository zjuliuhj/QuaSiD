model:
  target: models.quasid.quasid_sde.QuaSiD_sde
  params:
    seq_length: 256
    channels: 50
    max_step: 500
    sampling_steps: 200
    cfg_scale: 0.0
    beta_min: 0.1
    beta_max: 10.0
    freq_keep_ratio: 1.0
    backbone: dit_solver_v5
    use_pmi_corr: true
    use_loss_weight: true
    inst_norm: false
    emb_size: 256
    corr_rank: 128
    patch_size: 1
    num_layers: 4

solver:
  base_lr: 1.0e-04
  train_steps: 12000
  mixed_precision: bf16
  grad_accum_every: 2
  ckpt_count: 5
  save_cycle: 2400
  ema:
    decay: 0.995
    update_interval: 10
  scheduler:
    target: engine.lr_sch.CosineAnnealingLRWithWarmup
    params:
      T_max: 12000
      min_lr: 1.0e-04
      warmup_lr: 1.0e-03
      warmup: 500
      verbose: false

dataloader:
  dataset:
    target: data.dataset_utils.time_series_dataset.TimeSeriesDataset
    params:
      data_root: ./data/datasets/fmri.npy
      window: 256
      channels: 50
      stride: 1
      split_ratio: 1.0
      normalization: minmax
  batch_size: 32
  sample_size: 64
  num_workers: 4
  pin_memory: true
  persistent_workers: true
  prefetch_factor: 2
  shuffle: true
