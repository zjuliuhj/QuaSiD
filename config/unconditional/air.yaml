model:
  target: models.quasid.quasid_cont.QuaSiD_cont
  params:
    seq_length: 256
    channels: 13
    max_step: 2500
    sampling_steps: 1000
    sampler: sde
    cfg_scale: 0.0
    beta_min: 0.1
    beta_max: 20.0
    freq_keep_ratio: 1.0
    backbone: dit_solver_v5
    use_pmi_corr: true
    use_loss_weight: false
    inst_norm: false
    emb_size: 256
    corr_rank: 64
    patch_size: 1
    num_layers: 4

solver:
  base_lr: 1.0e-04
  train_steps: 20000
  mixed_precision: bf16
  grad_accum_every: 2
  ckpt_count: 5
  save_cycle: 2000
  ema:
    decay: 0.995
    update_interval: 10
  scheduler:
    target: engine.lr_sch.CosineAnnealingLRWithWarmup
    params:
      T_max: 20000
      min_lr: 1.0e-04
      warmup_lr: 1.0e-03
      warmup: 500
      verbose: false

dataloader:
  dataset:
    target: data.dataset_utils.time_series_dataset.TimeSeriesDataset
    params:
      data_root: ./data/datasets/air.npy
      window: 256
      channels: 13
      stride: 1
      split_ratio: 1.0
      normalization: minmax
  batch_size: 128
  sample_size: 256
  num_workers: 4
  pin_memory: true
  persistent_workers: true
  prefetch_factor: 2
  shuffle: true
