model:
  target: models.quasid.quasid_sde.QuaSiD_sde
  params:
    seq_length: 256
    channels: 5
    max_step: 1000
    sampling_steps: 500
    cfg_scale: 0.0
    beta_min: 0.1
    beta_max: 20.0
    freq_keep_ratio: 1.0
    backbone: dit_solver_v5
    use_pmi_corr: true
    use_loss_weight: false
    inst_norm: false
    emb_size: 256
    corr_rank: 64
    patch_size: 1
    num_layers: 4

solver:
  base_lr: 1.0e-04
  train_steps: 20000
  mixed_precision: bf16
  grad_accum_every: 2
  ckpt_count: 10
  save_cycle: 2000
  ema:
    decay: 0.995
    update_interval: 10
  scheduler:
    target: engine.lr_sch.CosineAnnealingLRWithWarmup
    params:
      T_max: 20000
      min_lr: 1.0e-04
      warmup_lr: 1.0e-03
      warmup: 500
      verbose: false

dataloader:
  dataset:
    target: utils.sine_dataset.SineDataset
    params:
      window: 256
      num: 30000
      dim: 5
      seed: 123
      normalization: minmax
  batch_size: 128
  sample_size: 256
  num_workers: 4
  pin_memory: true
  persistent_workers: true
  prefetch_factor: 2
  shuffle: true
