model:
  target: models.quasid.quasid_cont.QuaSiD_cont
  params:
    seq_length: 224
    channels: 7
    condition_domain: frequency
    max_step: 500
    sampling_steps: 200
    sampler: sde
    cfg_scale: 2.5
    freq_keep_ratio: 1.0
    backbone: dit_solver_v5
    use_pmi_corr: true
    inst_norm: true
    emb_size: 256
    corr_rank: 64
    patch_size: 1
    num_layers: 4
    channel_indep: false

solver:
  base_lr: 1.0e-05
  train_steps: 20000
  mixed_precision: bf16
  grad_accum_every: 2
  ckpt_count: 10
  save_cycle: 2000
  validation:
    enabled: true
    interval: 2000
    max_batches: null
    early_stopping:
      enabled: true
      patience: 2
  ema:
    decay: 0.995
    update_interval: 10
  scheduler:
    target: engine.lr_sch.CosineAnnealingLRWithWarmup
    params:
      T_max: 20000
      min_lr: 1.0e-04
      warmup_lr: 1.0e-03
      warmup: 500
      verbose: false

dataloader:
  dataset:
    target: data.dataset_utils.forecasting_dataset.ForecastingDataset
    params:
      data_root: ./data/datasets/etth1.npy
      history_length: 96
      pred_length: 128
      channels: 7
      stride: 1
      split_lengths: [8640, 2880, 2880]
      normalization: zscore
      condition_format: sequence
  test_sample_limit: null
  batch_size: 32
  sample_size: 64
  num_workers: 4
  pin_memory: true
  persistent_workers: true
  prefetch_factor: 2
  shuffle: true
